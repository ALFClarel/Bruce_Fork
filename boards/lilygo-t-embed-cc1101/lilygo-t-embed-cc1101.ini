
[env:lilygo-t-embed-cc1101]
board = lilygo-t-embed-cc1101
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter =
    ${env.build_src_filter}
    +<../boards/lilygo-t-embed-cc1101/interface.cpp>
    -<modules/lora/>
    -<modules/gps/>
    -<modules/fm/>
    -<modules/ethernet/EthernetHelper.cpp>
    -<modules/ethernet/ESPNetifEthernetClient.cpp>
    -<modules/ethernet/DHCPStarvation.cpp>
    -<modules/ethernet/MACFlooding.cpp>
    -<modules/others/ibutton.cpp>
    -<modules/rfid/rfid125.cpp>
    -<modules/rfid/RFID2.cpp>
    -<modules/rfid/ST25R3916.cpp>
    -<modules/rfid/amiibo.cpp>
    -<modules/rfid/chameleon.cpp>
    -<modules/rfid/pn532ble.cpp>
    -<modules/rfid/PN532KillerTools.cpp>
    -<core/menu_items/LoRaMenu.cpp>
    -<core/menu_items/GpsMenu.cpp>
    -<core/menu_items/FMMenu.cpp>
    -<core/menu_items/EthernetMenu.cpp>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-embed-cc1101
	-Os
	-include include/tembed_capabilities.h
	-DBRUCE_TEMBED_BASE
	-DCORE_DEBUG_LEVEL=0
	-DMIC_SPM1423

	-DRF_TX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DRF_RX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_TX_PINS='{{"Default", 2}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_RX_PINS='{{"Default", 1}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DDEVICE_NAME='"Lilygo T-Embed CC1101"'

build_unflags = -O2 -O3 -Og
build_src_flags = ${env.build_src_flags}

lib_deps =
	https://github.com/sayacom/WireGuard-ESP32-Arduino#feature/esp-netif
	https://github.com/bmorcelli/IRremoteESP8266
	paulstoffregen/Time@1.6.1
	LibSSH-ESP32
	Adafruit BusIO=https://github.com/emericklaw/Adafruit-BusIO_Bruce@1.17.2-bruce.1
	Adafruit PN532=https://github.com/emericklaw/Adafruit-PN532_Bruce@1.3.3-bruce.1
	https://github.com/huckor/BER-TLV.git
	https://github.com/rennancockles/SimpleCLI
	NTPClient@3.2.1
	ESP32Time@2.0.6
	FFat
	bblanchon/ArduinoJson
	ESP8266Audio@^2.4.1
	earlephilhower/ESP8266SAM@^1.1.0
	tinyu-zhao/FFT@^0.0.1
	h2zero/NimBLE-Arduino@2.5
	Bodmer/JPEGDecoder
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	mquickjs=https://github.com/BruceDevices/mquickjs#0.0.6
	https://github.com/bmorcelli/ESP32-PsRamFS#patch-1
	bitbank2/AnimatedGIF
	bitbank2/PNGdec @ ^1.1.2
	ESP32Async/ESPAsyncWebServer
	fastled/FastLED @3.10.3
	lewisxhe/XPowersLib @^0.3.3
