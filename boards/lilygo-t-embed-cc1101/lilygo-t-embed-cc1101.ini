
[env:lilygo-t-embed-cc1101]
board = lilygo-t-embed-cc1101
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter =
    ${env.build_src_filter}
    +<../boards/lilygo-t-embed-cc1101/interface.cpp>
    -<modules/lora/>
    -<modules/gps/>
    -<modules/fm/>
    -<modules/ethernet/EthernetHelper.cpp>
    -<modules/ethernet/ESPNetifEthernetClient.cpp>
    -<modules/ethernet/DHCPStarvation.cpp>
    -<modules/ethernet/MACFlooding.cpp>
    -<modules/others/ibutton.cpp>
    -<modules/rfid/rfid125.cpp>
    -<modules/rfid/RFID2.cpp>
    -<modules/rfid/ST25R3916.cpp>
    -<modules/rfid/amiibo.cpp>
    -<modules/rfid/chameleon.cpp>
    -<modules/rfid/pn532ble.cpp>
    -<modules/rfid/PN532KillerTools.cpp>
    -<core/menu_items/LoRaMenu.cpp>
    -<core/menu_items/GpsMenu.cpp>
    -<core/menu_items/FMMenu.cpp>
    -<core/menu_items/EthernetMenu.cpp>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-embed-cc1101
	-Os
	-include include/tembed_capabilities.h
	-DBRUCE_TEMBED_BASE
	-DCORE_DEBUG_LEVEL=0
	-DMIC_SPM1423
	-DRF_TX_PINS='{{"CC1101", 3}}'
	-DRF_RX_PINS='{{"CC1101", 3}}'
	-DIR_TX_PINS='{{"Onboard", 2}}'
	-DIR_RX_PINS='{{"Onboard", 1}}'

	-DDEVICE_NAME='"Lilygo T-Embed CC1101"'

build_unflags = -O2 -O3 -Og
build_src_flags = ${env.build_src_flags}

lib_deps =
	https://github.com/sayacom/WireGuard-ESP32-Arduino#90aa6b43965c9718d62e59ddd709f856722f8e0b
	https://github.com/bmorcelli/IRremoteESP8266#22cd38c653c4bdc61c1e7dad18affe58e5915177
	paulstoffregen/Time@1.6.1
	LibSSH-ESP32@5.10.0
	Adafruit BusIO=https://github.com/emericklaw/Adafruit-BusIO_Bruce#27230c1ddbb3983e1bd5abc025fcc84f6a8c2c5e
	Adafruit PN532=https://github.com/emericklaw/Adafruit-PN532_Bruce#e91d69575fa6a6052bff779885a1c616825fc0af
	https://github.com/huckor/BER-TLV#bd61b70eaa360779605b10f0641bcf01d00bee76
	https://github.com/rennancockles/SimpleCLI#b23d377935c80cc5a9214bcf24e1f1cf68debc6a
	NTPClient@3.2.1
	ESP32Time@2.0.6
	FFat
	bblanchon/ArduinoJson@7.4.3
	ESP8266Audio@2.4.1
	earlephilhower/ESP8266SAM@1.1.0
	tinyu-zhao/FFT@0.0.1
	h2zero/NimBLE-Arduino@2.5.2
	Bodmer/JPEGDecoder@2.0.0
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib#7bba5217dc0632f718a3278dc27e401016741a95
	mquickjs=https://github.com/BruceDevices/mquickjs#169b5ea7723bf43d7be9631a14f9c2a1ed8c69e1
	https://github.com/bmorcelli/ESP32-PsRamFS#5ace2e66c10d5647f10f48b22a79d9b12a73db7b
	bitbank2/AnimatedGIF@2.2.3
	bitbank2/PNGdec@1.1.6
	ESP32Async/ESPAsyncWebServer@3.12.1
	fastled/FastLED @3.10.3
	lewisxhe/XPowersLib@0.3.3
	ESP32Async/AsyncTCP@3.5.0
